<template>
  <style>
    /* Root — sized to the 1080x1080 canvas; never a background here (full-bleed rule below). */
    #root {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Full-bleed cream ground — its own dedicated clip layer, never painted on #root. */
    .flow1-login-bg {
      position: absolute;
      inset: 0;
      background-color: #FBF7EC;
    }

    /* The framed window: shared geometry across frames 1-3 — left:40, top:228, 1000x625. */
    .flow1-login-window {
      position: absolute;
      left: 40px;
      top: 228px;
      width: 1000px;
      height: 625px;
      border: 1px solid #C9A227;
      background-color: transparent;
      overflow: hidden;
      transform-origin: 50% 50%;
    }

    .flow1-login-window img {
      display: block;
      width: 1000px;
      height: 625px;
    }

    /* Cursor actor: a positioning wrapper (moved via GSAP x/y only, no static CSS transform on it)
       anchored at its Scene-2 starting point, canvas (540, 460). Ring + dot are children placed via
       fixed left/top offsets (never CSS transform) so GSAP can freely animate scale/opacity on them
       without clobbering a centering transform. */
    .flow1-login-cursor {
      position: absolute;
      left: 540px;
      top: 460px;
      width: 0;
      height: 0;
      opacity: 0;
    }

    .flow1-login-cursor-ring {
      position: absolute;
      left: -13px;
      top: -13px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #C9A227;
      background: none;
    }

    .flow1-login-cursor-dot {
      position: absolute;
      left: -10px;
      top: -10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: #1B1712;
    }
  </style>

  <div id="root" data-composition-id="flow1-login" data-width="1080" data-height="1080" data-duration="4">
    <div class="clip flow1-login-bg" data-start="0" data-duration="4" data-track-index="0"></div>

    <div class="clip flow1-login-window" data-start="0" data-duration="4" data-track-index="1">
      <img src="assets/flow-login.png" alt="" />
    </div>

    <div class="clip flow1-login-cursor" data-start="0" data-duration="4" data-track-index="2">
      <div class="flow1-login-cursor-ring"></div>
      <div class="flow1-login-cursor-dot"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-0.6s): window fades/settles in at the shared geometry, screenshot fully visible.
    // Cursor is not yet on screen (opacity 0 from its base CSS state).
    tl.fromTo(
      '.flow1-login-window',
      { opacity: 0, scale: 1.02 },
      { opacity: 1, scale: 1, duration: 0.6, ease: 'power3.out' },
      0
    );

    // Scene 2 (0.6-2.2s): cursor fades in quickly at (540,460), then glides (power3) to the
    // "Sign in" button center at (540,566) — a delta of (0, +106) from its anchored start —
    // arriving at t ~= 2.0s.
    tl.fromTo(
      '.flow1-login-cursor',
      { opacity: 0, x: 0, y: 0 },
      { opacity: 1, duration: 0.15, ease: 'power1.out' },
      0.6
    );
    tl.to(
      '.flow1-login-cursor',
      { x: 0, y: 106, duration: 1.25, ease: 'power3.out' },
      0.75
    );

    // Scene 3 (2.0-2.35s): click-pulse right on arrival. Outer ring scales 1 -> 2.2 while fading
    // out (power2.out, ~0.35s) so it does not linger; inner dot does a fast compress-release.
    tl.to(
      '.flow1-login-cursor-ring',
      { scale: 2.2, opacity: 0, duration: 0.35, ease: 'power2.out', transformOrigin: '50% 50%' },
      2.0
    );
    tl.to(
      '.flow1-login-cursor-dot',
      { scale: 0.8, duration: 0.075, ease: 'power2.in', transformOrigin: '50% 50%' },
      2.0
    )
      .to(
        '.flow1-login-cursor-dot',
        { scale: 1, duration: 0.075, ease: 'power2.out', transformOrigin: '50% 50%' },
        2.075
      );

    // Scene 4 (2.35-4.0s): held on the clicked button. A couple of tiny, finite sine-driven
    // nudges only — no repeat/yoyo, no continuous drift.
    tl.to(
      '.flow1-login-cursor',
      { x: '+=1.5', y: '-=1', duration: 0.4, ease: 'sine.inOut' },
      2.6
    ).to(
      '.flow1-login-cursor',
      { x: '-=1.5', y: '+=1', duration: 0.4, ease: 'sine.inOut' },
      3.2
    );

    window.__timelines['flow1-login'] = tl;
  </script>
</template>
