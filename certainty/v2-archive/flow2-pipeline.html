<template>
  <style>
    /* Root — styled by #root only (never a class); see hyperframes-core Pitfall 3. */
    #root {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    /* Full-bleed ground: the canvas's own cream base (frame.md bg-primary). */
    .flow2-pipeline-bg {
      position: absolute;
      inset: 0;
      background: #FBF7EC;
    }

    /* Shared window geometry (frames 1-3): bordered box, transparent fill. */
    .flow2-pipeline-window {
      position: absolute;
      left: 40px;
      top: 228px;
      width: 1000px;
      height: 625px;
      overflow: hidden;
      border: 1px solid #C9A227;
      background: transparent;
      transform-origin: 50% 50%;
    }

    .flow2-pipeline-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1000px;
      height: 625px;
    }

    /* Cursor actor: inner ink dot + outer ochre ring, both centered on the
       same point via margin offsets (never CSS transform, since GSAP owns
       transform on both the group and the ring). */
    .flow2-pipeline-cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      opacity: 0;
    }

    .flow2-pipeline-cursor-dot {
      position: absolute;
      left: -10px;
      top: -10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1B1712;
      transform-origin: 50% 50%;
    }

    .flow2-pipeline-cursor-ring {
      position: absolute;
      left: -13px;
      top: -13px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #C9A227;
      background: none;
      box-sizing: border-box;
      transform-origin: 50% 50%;
    }
  </style>

  <div id="root" data-composition-id="flow2-pipeline" data-width="1080" data-height="1080" data-duration="4">
    <div class="flow2-pipeline-bg clip" data-start="0" data-duration="4" data-track-index="0"></div>

    <div class="flow2-pipeline-window clip" data-start="0" data-duration="4" data-track-index="1">
      <img class="flow2-pipeline-img" src="assets/flow-pipeline.png" alt="">
    </div>

    <div class="flow2-pipeline-cursor clip" data-start="0" data-duration="4" data-track-index="2">
      <div class="flow2-pipeline-cursor-ring"></div>
      <div class="flow2-pipeline-cursor-dot"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const WIN = ".flow2-pipeline-window";
    const CURSOR = ".flow2-pipeline-cursor";
    const RING = ".flow2-pipeline-cursor-ring";
    const DOT = ".flow2-pipeline-cursor-dot";

    // Baseline render state (t=0 look, before the paused timeline is ever
    // scrubbed): cursor hidden at its entry point, ring/dot at rest.
    gsap.set(CURSOR, { x: 450, y: 300, opacity: 0 });
    gsap.set(RING, { scale: 1, opacity: 1 });
    gsap.set(DOT, { scale: 1 });

    // Scene 1 (0.0-0.5s): window fades/scales in. Cursor not yet visible.
    tl.fromTo(
      WIN,
      { opacity: 0, scale: 1.02 },
      { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      0
    );

    // Scene 2 (0.5-2.0s): cursor fades in at (450,300), then glides (power3)
    // to Nadia Rowe's card center at (279,407), arriving ~1.9s. Every
    // property's first-ever tween uses fromTo so a direct seek anywhere in
    // the timeline renders correctly, not just forward playback from t=0.
    tl.fromTo(
      CURSOR,
      { opacity: 0 },
      { opacity: 1, duration: 0.15, ease: "power1.out" },
      0.5
    ).fromTo(
      CURSOR,
      { x: 450, y: 300 },
      { x: 279, y: 407, duration: 1.4, ease: "power3.out" },
      0.5
    );

    // Scene 3 (1.9-2.25s): click-pulse right at arrival.
    // Ring: scale 1.0 -> ~2.2 while fading to 0 (power2.out, ~0.35s), then reset.
    tl.fromTo(
      RING,
      { scale: 1, opacity: 1 },
      { scale: 2.2, opacity: 0, duration: 0.35, ease: "power2.out" },
      1.9
    ).set(RING, { scale: 1, opacity: 1 }, 2.25);
    // Dot: fast compress-release (scale 1 -> 0.8 -> 1, ~0.15s).
    tl.fromTo(
      DOT,
      { scale: 1 },
      { scale: 0.8, duration: 0.075, ease: "power2.out" },
      1.9
    ).to(DOT, { scale: 1, duration: 0.075, ease: "power2.out" }, 1.975);

    // Scene 4 (2.25-4.0s): holds still. A couple of tiny finite sine-driven
    // jitters on the cursor group — absolute coordinates (not relative
    // += deltas) so any tween is safe to render from a direct seek; no
    // repeat/yoyo, fully deterministic.
    tl.fromTo(
      CURSOR,
      { x: 279, y: 407 },
      { x: 280, y: 406, duration: 0.4, ease: "sine.inOut" },
      2.8
    )
      .to(CURSOR, { x: 278, y: 408, duration: 0.4, ease: "sine.inOut" }, 3.2)
      .to(CURSOR, { x: 279, y: 407, duration: 0.4, ease: "sine.inOut" }, 3.6);

    window.__timelines["flow2-pipeline"] = tl;
  </script>
</template>
