  <script>
    (function () {
      var PAN_TO = -275;

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["f2-research"] = tl;

      // GSAP resolves string selectors itself (document-wide); ids are
      // frame-prefixed and unique in the assembled document, so there is no
      // need to locate this frame's own root element first.
      var windowEl = "[id='f2-research-window']";
      var textEl = "[id='f2-research-text']";
      var labelEl = "[id='f2-research-label']";
      var headerEl = "[id='f2-research-header']";
      var ruleEl = "[id='f2-research-rule']";
      var legendEl = "[id='f2-research-legend']";
      var ringEl = "[id='f2-research-ring']";
      var worldEl = "[id='f2-research-world']";

      /* ---------------- Scene 1 (0.0-1.0s): settle in ---------------- */
      tl.fromTo(
        windowEl,
        { opacity: 0, y: 18, scale: 1.04 },
        { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
        0.05,
      );

      tl.fromTo(ringEl, { opacity: 0 }, { opacity: 0.22, duration: 1.0, ease: "power3.out" }, 0.0);

      tl.fromTo(labelEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
      tl.fromTo(headerEl, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
      tl.fromTo(ruleEl, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.35, ease: "power3.out" }, 0.55);
      tl.fromTo(legendEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.75);

      /* ---------------- Scene 2 (1.0-3.0s): steady pan down ---------------- */
      tl.fromTo(worldEl, { y: 0 }, { y: PAN_TO, duration: 2.0, ease: "power3.inOut" }, 1.0);

      /* ---------------- Scene 3 (3.0-4.0s): held, subtle jitter only ------- */
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * 0.5,
          duration: 1.0,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            gsap.set(worldEl, { y: PAN_TO + s * 2 });
          },
        },
        3.0,
      );

      /* keep text column steady through the hold (no exit, no drift) */
      gsap.set(textEl, { opacity: 1 });
    })();
