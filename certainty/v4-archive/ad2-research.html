        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },

        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.22 },

        line2Groups,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.22 },

        "[id='ad2-research-window-wrap']",
        { scale: 1.008, duration: 0.2, ease: "power3.out" },
        3.6
      );

        { scale: 1.0, duration: 0.2, ease: "power3.inOut" },
