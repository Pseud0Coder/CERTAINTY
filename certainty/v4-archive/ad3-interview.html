<template>
  <div
    id="root"
    data-composition-id="ad3-interview"
    data-width="1080"
    data-height="1080"
    data-duration="4.5"
  >
    <div class="clip ad3-interview-bg" data-start="0" data-duration="4.5" data-track-index="0"></div>

    <div
      class="clip ad3-interview-phonewrap"
      data-start="0"
      data-duration="4.5"
      data-track-index="1"
    >
      <div id="ad3-interview-phonewindow" class="ad3-interview-phonewindow">
        <img
          id="ad3-interview-img-top"
          class="ad3-interview-img"
          src="assets/mobile-detail-top.png"
          alt=""
        />
        <img
          id="ad3-interview-img-star"
          class="ad3-interview-img"
          src="assets/mobile-detail-star.png"
          alt=""
          data-layout-allow-overflow="true"
        />
      </div>
    </div>

    <div
      class="clip ad3-interview-copywrap"
      data-start="0"
      data-duration="4.5"
      data-track-index="2"
    >
      <div class="ad3-interview-copyinner">
        <div class="ad3-interview-line">
          <span id="ad3-interview-l1-w1" class="ad3-interview-word">Every</span>
          <span id="ad3-interview-l1-w2" class="ad3-interview-word">interview.</span>
        </div>
        <div class="ad3-interview-line">
          <span id="ad3-interview-l2-w1" class="ad3-interview-word">Scored</span>
          <span id="ad3-interview-l2-w2" class="ad3-interview-word">the same way.</span>
        </div>
      </div>
    </div>
  </div>

  <style>
    @font-face { font-family: 'Georgia'; src: local('Georgia'); }
    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    .clip {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .ad3-interview-bg {
      background: #FBF7EC;
    }

    /* Phone window: left side, portrait bezel. Position via static CSS
       top/left/width/height (never animated); GSAP only animates
       opacity/scale/x/y on this element, so no transform conflict. */
    .ad3-interview-phonewindow {
      position: absolute;
      left: 100px;
      top: 170px;
      width: 380px;
      height: 720px;
      border: 1px solid #C9A227;
      border-radius: 32px;
      overflow: hidden;
      background: #FBF7EC;
      opacity: 0;
      will-change: transform, opacity;
    }

    /* Two stacked real mobile screenshots, both natively 780px wide,
       displayed at 380px (380/780 ~= 0.4872) -> displayed height
       1688 * 0.4872 ~= 822.4px. Top-anchored, no vertical panning:
       these are two discrete captured states crossfaded, not a pan. */
    .ad3-interview-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 380px;
      height: 822.4px;
      display: block;
    }

    #ad3-interview-img-top {
      opacity: 1;
    }

    #ad3-interview-img-star {
      opacity: 0;
    }

    /* Copy column: right side, roughly x:600-1040 / y:340-740. */
    .ad3-interview-copywrap {
      left: 600px;
      top: 340px;
      width: 440px;
      height: 400px;
    }

    .ad3-interview-copyinner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .ad3-interview-line {
      font-family: "Georgia", serif;
      font-weight: 500;
      font-size: 44px;
      line-height: 1.18;
      color: #1B1712;
    }

    .ad3-interview-word {
      display: inline-block;
      opacity: 0;
      margin-right: 0.28em;
      will-change: transform, opacity;
    }
  </style>

  <script>
    (function () {
      var phoneWindow = document.getElementById("ad3-interview-phonewindow");
      var imgTop = document.getElementById("ad3-interview-img-top");
      var imgStar = document.getElementById("ad3-interview-img-star");

      var l1w1 = document.getElementById("ad3-interview-l1-w1");
      var l1w2 = document.getElementById("ad3-interview-l1-w2");
      var l2w1 = document.getElementById("ad3-interview-l2-w1");
      var l2w2 = document.getElementById("ad3-interview-l2-w2");

      gsap.set(imgTop, { opacity: 1 });
      gsap.set(imgStar, { opacity: 0 });

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0-0.3s): phone window settles in on the left, showing
      // mobile-detail-top.png fully visible, mobile-detail-star.png at
      // opacity 0 underneath - visible well before 0.5s.
      tl.fromTo(
        phoneWindow,
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" },
        0
      );

      // Scene 2 (0.3-1.3s): copy line 1 word-groups stagger in on the right.
      tl.fromTo(
        l1w1,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.3
      );
      tl.fromTo(
        l1w2,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.55
      );

      // Scene 3 (1.3-2.3s): copy line 2 word-groups stagger in; at the same
      // time (starting ~1.3s, over ~0.4s) the phone content crossfades from
      // mobile-detail-top.png to mobile-detail-star.png, landing on the
      // real STAR percentages by ~1.7s.
      tl.fromTo(
        l2w1,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.3
      );
      tl.fromTo(
        l2w2,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        1.55
      );
      tl.to(imgTop, { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 1.3);
      tl.to(imgStar, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 1.3);

      // Scene 4 (2.3-3.6s): held on the STAR percentages, clearly visible;
      // copy fully settled. No further tween needed.

      // Scene 5 (3.6-4.0s): settle - a couple of tiny finite sine-driven
      // nudges on the phone window only, no repeat/yoyo.
      tl.to(phoneWindow, { x: 1.5, y: -1, duration: 0.15, ease: "sine.inOut" }, 3.6);
      tl.to(phoneWindow, { x: -1, y: 1.5, duration: 0.15, ease: "sine.inOut" }, 3.75);
      tl.to(phoneWindow, { x: 0, y: 0, duration: 0.1, ease: "sine.inOut" }, 3.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["ad3-interview"] = tl;
    })();
  </script>
</template>
