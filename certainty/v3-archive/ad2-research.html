      var tl = gsap.timeline({ paused: true });

      // Simultaneously, the device window begins a slow continuous pan down
      // toward the research-report findings, arriving by ~3.2s.

        { y: -350, duration: 2.0, ease: "power3.inOut" },

        { scale: 1.008, duration: 0.2, ease: "power3.out" },
