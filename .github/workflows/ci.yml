name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build web clients
        run: npm run build:web
      - name: Committed web-dist matches the source
        run: |
          if [ -n "$(git status --porcelain -- web-dist)" ]; then
            echo "web-dist is out of date. Run 'npm run build:web' and commit the result:"
            git status --porcelain -- web-dist
            exit 1
          fi
      - name: Unit, contract, red-team and golden-transcript tests
        run: npm test
      - name: Demo scenario smoke test (master prompt, section 15)
        run: node --test tests/scenario.test.ts
